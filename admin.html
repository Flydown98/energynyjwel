<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>캠페인 관리자 이동</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07152d;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    .box{text-align:center;padding:32px}.box b{color:#ffd324}.box p{color:#9cadc9;line-height:1.7}
    a{color:#ffd324;word-break:break-all}
  </style>
</head>
<body>
  <div class="box">
    <b>ADMIN</b>
    <h1>관리자 페이지로 이동합니다.</h1>
    <p id="msg">잠시만 기다려주세요.</p>
  </div>
  <script src="config.js"></script>
  <script>
    (() => {
      const msg = document.getElementById('msg');
      const base = window.CAMPAIGN_APP_CONFIG?.appsScriptUrl || '';
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(base)) {
        msg.textContent = 'config.js의 Apps Script URL을 확인해주세요.';
        return;
      }
      const joiner = base.includes('?') ? '&' : '?';
      const target = `${base}${joiner}page=admin`;
      msg.innerHTML = `자동 이동하지 않으면 <a href="${target}">여기를 눌러주세요.</a>`;
      location.replace(target);
    })();
  </script>
</body>
</html>
